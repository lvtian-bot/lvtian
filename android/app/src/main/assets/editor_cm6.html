<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeMirror 6 Markdown Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: white;}
        #editor { height: 100%; width: 100%; font-size: 16px; }
        
        /* 确保编辑器填满容器 */
        .cm-editor { height: 100%; }
        .cm-scroller { overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* 1. 边距与行距设置 */
        .cm-content { 
            padding: 12px !important; /* 左右边距调小，避免比预览页大 */
        }
        .cm-line {
            line-height: 1.5 !important; /* 全局行距调整为 1.5 */
            padding-top: 4px;
            padding-bottom: 4px;
        }

        /* 标题样式调整 (参照预览页 default 主题的比例) */
        /* 注意：.cm-header 是 span，margin 无效，只能调字体和行高 */
        /* entry.js 中已通过 HighlightStyle 显式定义了这些类名 */
        span.cm-header-1 { 
            font-size: 24px !important; 
            line-height: 1.5 !important; 
            color: #000 !important; 
            display: inline-block; 
            margin-top: 24px; 
            margin-bottom: 12px;
        }
        span.cm-header-2 { 
            font-size: 20px !important; 
            line-height: 1.5 !important; 
            color: #222 !important; 
            display: inline-block; 
            margin-top: 20px; 
            margin-bottom: 10px;
        }
        span.cm-header-3 { 
            font-size: 18px !important; 
            line-height: 1.5 !important; 
            color: #333 !important; 
            display: inline-block; 
            margin-top: 16px; 
            margin-bottom: 8px;
        }
        span.cm-header-4 { 
            font-size: 16px !important; 
            line-height: 1.5 !important; 
            color: #444 !important; 
            font-weight: bold !important; 
            display: inline-block; 
            margin-top: 12px; 
            margin-bottom: 8px;
        }
        span.cm-header-5 { 
            font-size: 16px !important; 
            line-height: 1.5 !important; 
            color: #555 !important; 
            font-weight: bold !important; 
            display: inline-block; 
        }
        span.cm-header-6 { 
            font-size: 16px !important; 
            line-height: 1.5 !important; 
            color: #666 !important; 
            font-weight: bold !important; 
            display: inline-block; 
        }

        /* 确保所有标题无下划线 */
        span[class*="cm-header-"] {
            border-bottom: none !important;
            text-decoration: none !important;
        }

        /* 3. Front Matter 绝杀修正 */
        /* 只要是在 .cm-frontmatter-line 这一行里的所有元素，统统重置样式 */
        /* 提高权重：必须比 span.cm-header-X (0,1,1) 更高 */
        .cm-content .cm-frontmatter-line,
        .cm-content .cm-frontmatter-line *,
        .cm-content .cm-frontmatter-line span {
            font-size: 14px !important; /* 强制小字体 */
            font-weight: normal !important; /* 强制不加粗 */
            color: #888 !important; /* 强制灰色 */
            text-decoration: none !important; /* 去掉任何下划线 */
            border: none !important;
            margin: 0 !important; /* 去掉标题可能带来的 margin */
            padding: 0 !important;
            line-height: 1.5 !important;
        }

        .cm-frontmatter-line {
            background-color: #fcfcfc !important; /* 极淡的背景区分 */
            display: block !important;
        }

        /* 简单的加载提示 */
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #888; font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Editor...</div>
    <div id="editor"></div>

    <!-- 引入打包好的 CodeMirror 6 bundle -->
    <script src="codemirror.bundle.js"></script>

    <script>
        // --- 日志转发 (Debug Helper) ---
        (function() {
            const originalLog = console.log;
            console.log = function(...args) {
                originalLog.apply(console, args);
                try {
                    const msg = args.map(arg => (typeof arg === 'object' ? JSON.stringify(arg) : String(arg))).join(' ');
                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'log', content: msg }));
                    }
                } catch (e) {}
            };
            const originalError = console.error;
            console.error = function(...args) {
                originalError.apply(console, args);
                try {
                    const msg = args.map(arg => (typeof arg === 'object' ? JSON.stringify(arg) : String(arg))).join(' ');
                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'error', content: msg }));
                    }
                } catch (e) {}
            };
        })();

        const editorElement = document.getElementById('editor');
        const loadingElement = document.getElementById('loading');
        let editorInstance = null;
        let lastContent = '';
        let autoSaveTimer = null;

        function initEditor() {
            if (!window.CM6) {
                console.error('CM6 global not found. Bundle load failed?');
                loadingElement.innerText = 'Error: CM6 bundle not loaded.';
                return;
            }

            try {
                editorInstance = CM6.createEditor(editorElement, '', {
                    darkMode: false, // 可以从 RN 传入参数控制
                    onUpdate: (content) => {
                        // 3秒防抖自动保存
                        clearTimeout(autoSaveTimer);
                        autoSaveTimer = setTimeout(() => {
                            if (content !== lastContent) {
                                lastContent = content;
                                sendAutoSave(content);
                            }
                        }, 3000);
                    }
                });
                
                loadingElement.style.display = 'none';
                console.log('CM6 Editor initialized successfully');
            } catch (err) {
                console.error('Failed to init editor:', err);
                loadingElement.innerText = 'Init Error: ' + err.message;
            }
        }

        // --- Communication with React Native ---

        function sendAutoSave(content) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'autoSave',
                    content: content
                }));
            }
        }

        function sendManualSave() {
            if (editorInstance && window.ReactNativeWebView) {
                const content = editorInstance.getContent();
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'manualSave',
                    content: content
                }));
            }
        }

        // 处理来自 RN 的消息
        function handleMessage(event) {
            try {
                const data = event.data;
                // 兼容旧逻辑，data 可能是 json string 或者 raw string
                let content = data;
                let type = null;

                try {
                    const parsed = JSON.parse(data);
                    if (parsed.type && parsed.content !== undefined) {
                        content = parsed.content;
                        type = parsed.type;
                    }
                } catch (e) {
                    // not json, assume raw content
                }

                if (editorInstance) {
                    // 只有当内容真正改变时才设置，避免光标跳动（虽然 CM6 处理得比较好）
                    const current = editorInstance.getContent();
                    if (current !== content) {
                        editorInstance.setContent(content);
                        lastContent = content; // 更新基准，避免触发自动保存
                    }
                }
            } catch (err) {
                console.error('Error handling message:', err);
            }
        }

        document.addEventListener("message", handleMessage);
        window.addEventListener("message", handleMessage);

        // 暴露给 RN 调用的全局方法 (WebView injectJavaScript)
        window.getContent = sendManualSave;

        // 启动
        // 稍微延时确保 DOM Ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEditor);
        } else {
            initEditor();
        }

    </script>
</body>
</html>
